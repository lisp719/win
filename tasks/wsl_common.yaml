- name: Ensure docker group exists
  become: true
  group:
    name: docker

- name: Add current user to docker group
  become: true
  user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: yes

- name: Install common packages
  become: true
  package:
    name:
      - bubblewrap
      - curl
      - git
      - htop
      - wget
    state: latest

- name: Install mise
  shell: curl https://mise.run | sh
  args:
    creates: ~/.local/bin/mise

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - ~/.bashrc.d
    - ~/.codex
    - ~/.copilot
    - ~/.config/gh
    - ~/.config/helix
    - ~/.config/jj
    - ~/.config/mise
    - ~/.config/opencode
    - ~/.config/zellij
    - ~/sandbox

- name: Copy AGENTS.md
  copy:
    src: "{{ playbook_dir }}/../settings/common/AGENTS.md"
    dest: "{{ item }}"
  loop:
    - ~/.copilot/copilot-instructions.md
    - ~/.config/opencode/AGENTS.md
    - ~/.codex/AGENTS.md

- name: Copy codex seed config (first install only)
  copy:
    src: "{{ playbook_dir }}/../settings/wsl/.codex/config.toml"
    dest: ~/.codex/config.toml
    force: no

- name: Copy CLI tool configs
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  loop:
    - src: "{{ playbook_dir }}/../settings/common/helix/config.toml"
      dest: ~/.config/helix/config.toml
    - src: "{{ playbook_dir }}/../settings/common/helix/languages.toml"
      dest: ~/.config/helix/languages.toml
    - src: "{{ playbook_dir }}/../settings/common/jj/config.toml"
      dest: ~/.config/jj/config.toml
    - src: "{{ playbook_dir }}/../settings/common/mise/config.toml"
      dest: ~/.config/mise/config.toml
    - src: "{{ playbook_dir }}/../settings/common/starship.toml"
      dest: ~/.config/starship.toml
    - src: "{{ playbook_dir }}/../settings/common/zellij/config.kdl"
      dest: ~/.config/zellij/config.kdl
    - src: "{{ playbook_dir }}/../settings/wsl/.config/gh/config.yml"
      dest: ~/.config/gh/config.yml
    - src: "{{ playbook_dir }}/../settings/wsl/.config/opencode/opencode.json"
      dest: ~/.config/opencode/opencode.json

- name: Copy shell configs
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  loop:
    - src: "{{ playbook_dir }}/../settings/wsl/.bashrc.d/custom.sh"
      dest: ~/.bashrc.d/custom.sh
    - src: "{{ playbook_dir }}/../settings/wsl/.gitconfig"
      dest: ~/.gitconfig

- name: Copy templates directory
  copy:
    src: "{{ playbook_dir }}/../settings/wsl/.templates/"
    dest: ~/.templates/
    mode: preserve

- name: Install mise tools
  shell: ~/.local/bin/mise install
  register: mise_install
  changed_when: "'all tools are installed' not in mise_install.stderr"
