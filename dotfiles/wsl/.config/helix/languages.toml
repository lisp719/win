[[language]]
name = "css"
auto-format = true
formatter = { command = "prettier", args = [
  "--stdin-filepath",
  "%{buffer_name}",
  "--parser",
  "css",
] }

[[language]]
name = "html"
auto-format = true
formatter = { command = "prettier", args = [
  "--stdin-filepath",
  "%{buffer_name}",
  "--parser",
  "html",
] }

[[language]]
name = "javascript"
auto-format = true
formatter = { command = "prettier", args = [
  "--stdin-filepath",
  "%{buffer_name}",
  "--parser",
  "babel",
] }

[[language]]
name = "json"
auto-format = true
formatter = { command = "prettier", args = [
  "--stdin-filepath",
  "%{buffer_name}",
  "--parser",
  "json",
] }

[[language]]
name = "jsonc"
auto-format = true
formatter = { command = "prettier", args = [
  "--stdin-filepath",
  "%{buffer_name}",
  "--parser",
  "json",
] }

[[language]]
name = "jsx"
auto-format = true
formatter = { command = "prettier", args = [
  "--stdin-filepath",
  "%{buffer_name}",
  "--parser",
