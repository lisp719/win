] }

[[language]]
name = "typescript"
auto-format = true
formatter = { command = "prettier", args = [
  "--stdin-filepath",
  "%{buffer_name}",
  "--parser",
  "typescript",
] }

[language-server.typescript-language-server]
command = "vtsls"
args = ["--stdio"]
