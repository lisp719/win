] }

[[language]]
name = "markdown"
auto-format = true
formatter = { command = "prettier", args = [
  "--stdin-filepath",
  "%{buffer_name}",
  "--parser",
  "markdown",
] }

[[language]]
name = "text"
scope = "source.text"
