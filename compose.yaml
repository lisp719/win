services:
  archlinux:
    image: archlinux
    command: sleep infinity
    volumes:
      - .:/workspace
    working_dir: /workspace
  fedora:
    image: fedora
    command: sleep infinity
    volumes:
      - .:/workspace
    working_dir: /workspace
  ubuntu:
    build:
      context: .
      dockerfile: ubuntu/Dockerfile.dev
    command: sleep infinity
    volumes:
      - .:/workspace
    working_dir: /workspace
